# Animation run: identical physics to naca0012_Re1000_aoa15_pimple.cfg, but a VTK frame every 2 steps (dt_frame = 0.1)
# for t >= 40, i.e. about 30 frames per shedding cycle over the last 20 time units.
case_type = external
body = naca
naca = 0012
aoa_deg = 15
nx = 350
ny = 250
x_min = -2
x_max = 5
y_min = -2.5
y_max = 2.5
reynolds = 1000
algorithm = pimple
pressure_rtol = 1e-3
max_steps = 1200
dt = 0.05
outer_correctors = 2
alpha_u = 0.7
pressure_correctors = 2
stop_at_steady = true
momentum_tolerance = 1e-5
continuity_tolerance = 1e-6
change_tolerance = 1e-7
log_every = 100
vtk_every = 2
vtk_start_time = 40
output = runs/video/naca0012_Re1000_aoa15
