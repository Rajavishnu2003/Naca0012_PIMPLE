# Laminar NACA 0012 at Re = 1000 (based on chord), angle of attack 4 deg (validation vs Kurtulus 2015, Di Ilio et al. 2020).
# PIMPLE pseudo-transient march to steady state: dt = 0.05 (CFL ~2.5 on h = 0.02), 2 outer correctors, alpha_u = 0.7, up to t = 60.
# Staircase body: about 50 cells along the chord, 6 cells across the thickness.
case_type = external
body = naca
naca = 0012
aoa_deg = 4
nx = 350
ny = 250
x_min = -2
x_max = 5
y_min = -2.5
y_max = 2.5
reynolds = 1000
algorithm = pimple
pressure_rtol = 1e-3
max_steps = 1200
dt = 0.05
outer_correctors = 2
alpha_u = 0.7
pressure_correctors = 2
stop_at_steady = true
momentum_tolerance = 1e-5
continuity_tolerance = 1e-6
change_tolerance = 1e-7
log_every = 100
# Binary VTK snapshot every 10 steps (t = 0.5) to vtk/; open flow.vtk.series in ParaView to animate.
vtk_every = 10
output = runs/naca0012_Re1000_aoa4_pimple
