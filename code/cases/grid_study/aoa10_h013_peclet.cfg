# Grid/scheme study, NACA 0012, Re = 1000, AoA 10 deg. Medium grid h = 0.0133 (cell Pe ~ 13), hybrid scheme.
# Reference (Kurtulus 2022 Table 1): Cl = 0.418, Cd = 0.165. Same domain, dt and solver settings as naca0012_Re1000_aoa10_pimple.cfg.
case_type = external
body = naca
naca = 0012
aoa_deg = 10
x_min = -2
x_max = 5
y_min = -2.5
y_max = 2.5
reynolds = 1000
algorithm = pimple
pressure_rtol = 1e-3
max_steps = 1200
dt = 0.05
outer_correctors = 2
alpha_u = 0.7
pressure_correctors = 2
stop_at_steady = true
momentum_tolerance = 1e-5
continuity_tolerance = 1e-6
change_tolerance = 1e-7
nx = 525
ny = 375
convection = peclet
log_every = 20
vtk_every = 20
output = runs/grid_study/aoa10_h013_peclet
